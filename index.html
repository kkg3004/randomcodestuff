<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello.</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #bigText {
            font-size: 4rem;
            text-align: center;
            transition: font-family 0.2s ease;
        }
    </style>
</head>
<body>
    <div id="bigText">kai.</div>
    <script>
        const textElement = document.getElementById('bigText');
        let fonts = [];
        let index = 0;
        async function loadGoogleFonts() {
            try {
                const response = await fetch('https://googleapis.com');
                const data = await response.json();
                fonts = data.items.slice(0, 100).map(item => item.family);
                setInterval(changeFont, 50);
            } catch (error) {
                console.error("Failed to load Google Fonts, falling back to local list.", error);
                fonts = ['Arial', 'Georgia', 'Courier New', 'Impact', 'Times New Roman', 'Verdana'];
                setInterval(changeFont, 50);
            }
        }
        function changeFont() {
            if (fonts.length === 0) return;
            const nextFont = fonts[index];
            const linkId = `font-${nextFont.replace(/\s+/g, '-')}`;
            if (!document.getElementById(linkId)) {
                const link = document.createElement('link');
                link.id = linkId;
                link.rel = 'stylesheet';
                link.href = `https://googleapis.com{encodeURIComponent(nextFont)}&display=swap`;
                document.head.appendChild(link);
            }
            textElement.style.fontFamily = `"${nextFont}", sans-serif`;
            index = (index + 1) % fonts.length;
        }
        loadGoogleFonts();
    </script>
</body>
</html>
