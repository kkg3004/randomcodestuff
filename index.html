<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello.</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #bigText {
            font-size: 4rem;
            text-align: center;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="bigText">kai.</div>

    <script>
        const textElement = document.getElementById('bigText');
        let index = 0;

        const fonts = [
            'Roboto', 'Open Sans', 'Montserrat', 'Lato', 
            'Oswald', 'Raleway', 'PT Sans', 'Merriweather', 
            'Playfair Display', 'Bebas Neue', 'Pacifico', 
            'Caveat', 'Abril Fatface'
        ];

        function changeFont() {
            if (fonts.length === 0) return;
            const nextFont = fonts[index];
            
            const linkId = `font-${nextFont.replace(/\s+/g, '-')}`;

            // 1. Check if this Google Font stylesheet has already been added to the head
            if (!document.getElementById(linkId)) {
                const link = document.createElement('link');
                link.id = linkId;
                link.rel = 'stylesheet';
                // FIXED: Corrected domain, path, and added the missing $ for string interpolation
                link.href = `https://googleapis.com{encodeURIComponent(nextFont)}&display=swap`;
                document.head.appendChild(link);
            }

            // 2. Apply the font family to the element
            textElement.style.fontFamily = `"${nextFont}", sans-serif`;

            // 3. Move to the next font index safely
            index = (index + 1) % fonts.length;
        }

        // Run the cycle every 1.5 seconds
        setInterval(changeFont, 1500);
        
        // Run once immediately on page load
        changeFont();
    </script>
</body>
</html>
