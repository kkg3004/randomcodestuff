<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing Font Text</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #bigText {
            font-size: 4rem;
            text-align: center;
            transition: font-family 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="bigText">Hello World</div>

    <script>
        const textElement = document.getElementById('bigText');
        
        // List of fonts to cycle through
        const fonts = [
            'Arial, sans-serif',
            'Georgia, serif',
            'Courier New, monospace',
            'Impact, sans-serif',
            'Comic Sans MS, cursive',
            'Times New Roman, serif',
            'Verdana, sans-serif'
        ];

        let index = 0;

        function changeFont() {
            textElement.style.fontFamily = fonts[index];
            index = (index + 1) % fonts.length;
        }

        // Change font every 0.5 seconds (500ms)
        setInterval(changeFont, 500);
    </script>

</body>
</html>
